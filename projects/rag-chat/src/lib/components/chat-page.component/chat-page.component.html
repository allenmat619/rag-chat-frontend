<mat-drawer-container class="main-container" autosize>
  <mat-drawer #drawer mode="side">
    <chat-side-nav [reloadChats]="reloadChats" (chat-selected)="onChatSelected($event)"></chat-side-nav>
  </mat-drawer>

  <div>
    <button type="button" matButton (click)="drawer.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <rag-chat (message-submitted)="onMessageSubmitted($event)" [chatResponse]="chatResponse" [isLoading]="isLoading"
      [previousMessages]="previousMessages">
    </rag-chat>
  </div>

</mat-drawer-container>
