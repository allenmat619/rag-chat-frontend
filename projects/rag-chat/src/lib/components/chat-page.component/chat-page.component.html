<mat-drawer-container class="example-container" autosize>
  <mat-drawer #drawer class="example-sidenav" mode="side">
    <div class="chats-container">
      <button matButton (click)="newChat()">New Chat...</button>

      <mat-list>
        @for (chat of allChats; track $index) {
        <mat-list-item>
          <button matButton (click)="selectChat(chat.chatId)">{{chat.title}}</button>
        </mat-list-item>
        }
      </mat-list>

    </div>

  </mat-drawer>

  <div class="example-sidenav-content">
    <button type="button" matButton (click)="drawer.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <rag-chat (message-submitted)="onMessageSubmitted($event)" [chatResponse]="chatResponse" [isLoading]="isLoading"
      [previousMessages]="previousMessages">
    </rag-chat>
  </div>

</mat-drawer-container>
